<img src="{{ poster().posterUrl }}" alt="{{ poster().title }}">
<h2>{{ poster().title }}</h2>
<p>{{ poster().year }}</p>
<p>{{ poster().genre }}</p>
<p>{{ poster().rating }}</p>
<button class='toggle' (click)="toggleFavorite.emit(poster().id)">
  {{ poster().isFavorite ? 'Remove from favorite' : 'Add to favorite' }}
</button>
